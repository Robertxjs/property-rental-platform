<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>RentApp - Welcome</title>
    <script>
        // Verificăm dacă există un utilizator salvat în memoria browserului (localStorage)
        const userJson = localStorage.getItem("user");
        if (!userJson) {
            window.location.href = "login.html"; // Redirecționare la login 
        } else {
            const user = JSON.parse(userJson);

            if(user.role == "TENANT"){
                window.location.href = "browse.html";
            }else{
                window.location.href = "dashboard.html";
            }
        }
    </script>
</head>
<body>
    <p>Se încarcă...</p>
</body>
</html>
