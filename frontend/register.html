<!DOCTYPE html>
<html lang="ro">
<head>

    <link rel="icon" type="image/x-icon" href="favicon.ico?v=1">

    <meta charset="UTF-8">
    <title>Înregistrare - RentApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--
    <div class="logo-centrat">
    <img src="logo.png" alt="Logo" style="max-width: 280px; margin-bottom: -20px; 
    margin-top: -150px;">
    </div>
-->

    <div class="auth-container">
        <h2>Creează un cont nou</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Nume Complet:</label>
                <input type="text" id="regFullName" required>
            </div>
            <div class="form-group">
                <label>Email (va fi unic):</label>
                <input type="email" id="regEmail" required>
            </div>
            <div class="form-group">
                <label>Parolă:</label>
                <input type="password" id="regPassword" required>
            </div>
            <div class="form-group">
                <label>Telefon:</label>
                <input type="text" id="regPhone">
            </div>
            <div class="form-group">
                <label>Tip Utilizator (Rol):</label>
                <select id="regRole">
                    <option value="TENANT">Chiriaș (Tenant)</option>
                    <option value="LANDLORD">Proprietar (Landlord)</option>
                </select>
            </div>
            <button type="submit">Înregistrare</button>
        </form>
        <p>Ai deja cont? <a href="login.html">Conectează-te aici</a></p>
        <div id="registerMessage" class="message"></div>
    </div>

    <div>
    <img src="logo.png" alt="Logo" style="max-width: 280px; margin-bottom: -20px; 
    margin-top: -130px; margin-left: 100px; margin-right: 20px;">
    </div>

    <script src="app.js"></script>
</body>
</html>
