<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Autentificare - RentApp</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=1">
</head>
<body style="flex-direction: column;"> 
    
    <div class="logo-centrat" style="display: flex; justify-content: center;">
    <img src="logo.png" alt="Logo" style="max-width: 280px; margin-bottom: -20px; margin-top: -150px;">
    </div>

    <div class="auth-container">
        <h2>Autentificare</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Parolă:</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit">Conectare</button>
        </form>
        <p>Nu ai un cont? <a href="register.html">Înregistrează-te aici</a></p>
        <div id="loginMessage" class="message"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
